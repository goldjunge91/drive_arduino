services:
  ros2-dev:
    build:
      # Build context is the repository root so the Dockerfile can COPY
      # other packages (e.g. src/serial) into the image. This produces a
      # standalone workspace inside the container (no host mount required).
      context: ../../
      dockerfile: src/drive_arduino/Dockerfile
    container_name: robot-ros2_full-dev
    working_dir: /ros2_ws
    # No volumes: this container will use a standalone workspace baked into
    # the image (COPY from build context). Do not mount the host workspace.
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - ROS_DOMAIN_ID=42
    network_mode: host
    stdin_open: true
    tty: true
        # Uncomment for GUI support on Linux
