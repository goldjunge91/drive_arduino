services:
  ros2_drive_dev:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        INSTALL_DESKTOP_TOOLS: 1
        INSTALL_GAZEBO: 1
        INSTALL_ROBOT: 1
    container_name: ros2_drive_dev
    working_dir: /ros2_ws
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - ROS_DOMAIN_ID=42
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      # Bind-mount host repo into workspace for live edit-build
      - ./:/ros2_ws/src/drive_arduino:rw
      # Keep build/install/log out of the host tree
      - ros2_build_cache:/ros2_ws/build
      - ros2_install_cache:/ros2_ws/install
      - ros2_log_cache:/ros2_ws/log
      # X11 (optional)
      # - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash -lc "source /opt/ros/humble/setup.bash && bash"

  robot:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        INSTALL_DESKTOP_TOOLS: 1
        INSTALL_GAZEBO: 1
        INSTALL_ROBOT: 1
    container_name: robot
    working_dir: /ros2_ws
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - ROS_DOMAIN_ID=42
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      - ros2_build_cache:/ros2_ws/build
      - ros2_install_cache:/ros2_ws/install
      - ros2_log_cache:/ros2_ws/log
    command: >-
      bash -lc "
      set -euo pipefail; 
      source /opt/ros/humble/setup.bash && 
      cd /ros2_ws && 
      colcon build --symlink-install && 
      source install/setup.bash && 
      bash"

  lint:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        INSTALL_DESKTOP_TOOLS: 1
        INSTALL_GAZEBO: 1
        INSTALL_ROBOT: 1
    container_name: ros2_drive_lint
    working_dir: /ros2_ws
    environment:
      - ROS_DOMAIN_ID=42
    volumes:
      - ./src:/ros2_ws/src:rw
      - ./scripts:/ros2_ws/scripts:ro
      - ros2_build_cache:/ros2_ws/build
      - ros2_install_cache:/ros2_ws/install
      - ros2_log_cache:/ros2_ws/log
    command: >-
      bash -lc "
      set -eo pipefail;
      source /opt/ros/humble/setup.bash &&
      if [ -f /ros2_ws/scripts/add_copyright_headers.sh ]; then \
        bash /ros2_ws/scripts/add_copyright_headers.sh --scope src/mecabridge_hardware || true; \
      fi &&
      export AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS=1 &&
      ament_cpplint src &&
      ament_cppcheck src &&
      ament_lint_cmake src &&
      ament_flake8 src &&
      ament_pep257 src &&
      ament_xmllint src &&
      ament_uncrustify --all src
      "
    profiles:
      - lint

volumes:
  ros2_build_cache:
  ros2_install_cache:
  ros2_log_cache:
